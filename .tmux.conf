# Use user's login shell
set-option -g default-shell "$SHELL"

# SSH Agent Session
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_CONNECTION WINDOWID XAUTHORITY"

# ESCシーケンスの無効化
set -sg escape-time 0

# カーソルのちらつきを防ぐ
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "tmux-256color"' 'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ',*:Ss@,Se@'   # DECSCUSR無効化
if-shell 'tmux -V | cut -d" " -f2 | grep -Eq "^(3\\.[2-9]|[4-9])"' 'set -as terminal-features ",tmux-256color:RGB"'

# マウス操作を有効化
set -g mouse on

setw -g mode-keys vi

# ウィンドウ番号を1から開始（0は押しにくい）
set -g base-index 1

# プレフィックスキーをCtrl-aに変更
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# クリップボード設定
run-shell -b 'if command -v pbcopy >/dev/null 2>&1; then tmux set -g @copy_cmd "pbcopy"; elif command -v wl-copy >/dev/null 2>&1; then tmux set -g @copy_cmd "wl-copy"; elif command -v xclip >/dev/null 2>&1; then tmux set -g @copy_cmd "xclip -in -selection clipboard"; else tmux set -g @copy_cmd "cat >/dev/null"; fi'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"

# ペインスタイル
set -g window-active-style 'fg=colour231,bg=colour16'   # 純白文字、黒背景
if-shell 'tmux -V | cut -d" " -f2 | grep -Eq "^(3\\.[2-9]|[4-9])"' 'set -g pane-border-lines heavy'
set -g window-style 'fg=colour242,bg=colour234'         # グレー文字、ダークグレー背景

# ペイン移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインの拡張/縮小
bind -r C-h resize-pane -L 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5
bind -r C-j resize-pane -D 5

# split
bind s split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# Session
bind S choose-session

# ステータスバーのカスタマイズ
set -g status-bg colour235
set -g status-fg white
set -g status-left-length 40
set -g status-left "#[fg=green]#S #[fg=yellow]#I:#P"

#set-option -g allow-rename off
